spring.application.name=domain

#Database
spring.datasource.url=jdbc:h2:mem:domain
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false
spring.h2.console.enabled=true

# HikariCP specific settings
spring.datasource.hikari.pool-name=Domain-Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Optional settings
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1


#JWT
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=6000000

#Spring properties
spring.main.allow-circular-references=true

#Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Kafka 
kafka.directory.name=C:/Users/Nehal Mahajan/OneDrive/Desktop/Kafka/employee.xlsx
kafka.topic.name=testing-topic

# Actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=health,info,metrics,env,loggers

